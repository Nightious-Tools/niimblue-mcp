- id: d1988913334401191d5bb4765ea44cb6
  title: Store fill-in label templates on disk
  decision: 'render_label gains rows: values for {key} fields. With 1 row the server fills the text before
    it builds the link, so the user''s open CSV in NiimBlue stays as it is. With more rows the link carries
    the rows as NiimBlue''s own CSV (csv.data, d3-dsv format) and NiimBlue prints one label per row. save_as
    writes <slug>.args.json (the render args) and <slug>.niimblue.json (an export that NiimBlue''s Saved
    labels can import) to NIIMBLUE_TEMPLATES_DIR, default ~/Documents/NiimBlue Templates. An existing
    template is refused unless overwrite: true. The slug keeps Unicode letters, marks and digits and nothing
    else, so a name can''t leave the folder. A name with no letter or digit is BAD_INPUT, not a shared
    fallback name. list_templates and get_template read the folder. get_template also converts a NiimBlue
    .json export to args. It refuses images, ArUco markers, paths and groups instead of dropping them,
    which keeps the page''s no-external-load rule. This supersedes the "never write files" part of the
    consequences of "Render in headless Chrome and hand off printing as a NiimBlue link", and the CLAUDE.md
    rule against writing files.'
  reason: Saved args are the format the agent already writes, so reprinting a template is one render_label
    call. The .niimblue.json beside it lets the user open the same template in NiimBlue without the agent.
    Writing only on save_as, into one folder and never over a file without overwrite, keeps the write
    surface small enough for an unattended agent.
  scope:
  - skills/niimblue/SKILL.md
  - src/config.ts
  - src/label.ts
  - src/server.ts
  - src/templates.ts
  currency: active
  source: cli
  accepted_at: '2026-10-21T20:37:04.295031'
  accepted_by: nightious
  accepted_artifact: .repowise/decisions.yaml
  evidence:
  - 1b3bc49
- id: fa6f2f2cafe916dfff57490c7ae331e3
  title: Load bundled and user font files into the unsandboxed preview
  decision: 'The page loads five OFL fonts from fonts/ (JetBrains Mono Bold, Barlow Condensed Bold, Archivo
    Black, Archivo ExtraBold, Bitter Bold) and any .woff2, .ttf or .otf file up to 2 MB from NIIMBLUE_FONTS_DIR,
    default ~/Documents/NiimBlue Fonts. The server only reads that folder and never creates it. Tool input
    never builds a font path: fontFamily is a lookup key, checked against FAMILY_RX, and matched against
    the bundled list and the folder listing. Links and subfolders are listed as skipped, not followed.
    Chrome keeps --no-sandbox. Font bytes pass Chrome''s OTS check before FreeType and HarfBuzz parse
    them. INSTRUCTIONS and the skill tell agents never to download or write font files into the folder.
    The README tells users to put only fonts they trust there.'
  reason: A font file the user chose is as trusted as the rest of their machine, and OTS rejects malformed
    tables before the parsers see them. Turning the sandbox back on would bring back the root, container
    and AppArmor failures that "Render in headless Chrome and hand off printing as a NiimBlue link" avoided.
    Matching against a listing instead of joining a path keeps tool input out of the file system.
  scope:
  - .mcpbignore
  - CLAUDE.md
  - README.md
  - fonts/Archivo Black.woff2
  - fonts/Archivo ExtraBold.woff2
  - fonts/Barlow Condensed Bold.woff2
  - fonts/Bitter Bold.woff2
  - fonts/JetBrains Mono Bold.woff2
  - package.json
  - skills/niimblue/SKILL.md
  - src/chrome.ts
  - src/config.ts
  - src/fontdir.ts
  - src/fonts.ts
  - src/label.ts
  - src/page/render.ts
  - src/server.ts
