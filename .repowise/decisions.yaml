- id: 4933fa952744f86718e1393fbd0d2336
  title: Render in headless Chrome and hand off printing as a NiimBlue link
  decision: 'render_label runs NiimBlue''s own page code, pinned to a sha, in the system Chrome or Edge
    over --remote-debugging-pipe. It returns the threshold-140 1-bit PNG plus a #load= link that opens
    the label in NiimBlue. The server never talks to a printer.'
  reason: Running the app's own code is the only way to get the exact print preview. A Node re-implementation
    would drift from it. The link makes NiimBlue the one place that prints, and it ships no runtime npm
    dependencies.
  scope:
  - package.json
  - src
  currency: active
  source: cli
  accepted_at: '2026-10-21T20:37:04.289041'
  accepted_by: nightious
  accepted_artifact: .repowise/decisions.yaml
